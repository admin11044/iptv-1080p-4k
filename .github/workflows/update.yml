name: IPTV Auto Update

on:
  schedule:
    # 每 6 小时跑一次（UTC）。即北京时间 02:00 / 08:00 / 14:00 / 20:00
    - cron: '0 */6 * * *'
  workflow_dispatch:   # GitHub 网页端 Actions 标签可手动触发
  push:
    paths:
      - 'sources.txt'
      - 'collect.py'
      - 'requirements.txt'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect & Validate
        env:
          VALIDATE: "1"   # 只删明确 404/410 的死链；超时/403 视为「中国能播、海外测不了」而保留，避免误清空国内源
        run: python collect.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --cached --quiet || git commit -m "chore: auto update playlist $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
